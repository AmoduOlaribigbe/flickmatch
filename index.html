<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1d33">
<link rel="manifest" href="manifest.json">
<title>Flick Match</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1424; overflow: hidden; touch-action: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #view3d { background: #0f1d33; }

  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
  #pauseBtn { pointer-events: auto; position: absolute; top: 14px; right: 10px; width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(6,18,10,.65); color: #fff; font-weight: 900; font-size: 13px; letter-spacing: 1px; }

  #touchCtl { position: absolute; inset: 0; }
  #touchCtl[hidden] { display: none; }
  #stickZone { pointer-events: auto; position: absolute; left: 0; bottom: 0; width: 45%; height: 62%; touch-action: none; }
  #stickBase { position: absolute; left: 80px; top: calc(100% - 95px); width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
    background: rgba(255,255,255,.6); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  #btns { position: absolute; right: 8px; bottom: 18px; width: 190px; height: 190px; }
  .cbtn { pointer-events: auto; position: absolute; width: 66px; height: 66px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55);
    color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .2px; touch-action: none; box-shadow: 0 3px 0 rgba(0,0,0,.35); padding: 0; }
  .cbtn.on { transform: scale(.9); filter: brightness(1.35); }
  .cbtn.a { right: 62px; bottom: 0; background: rgba(22,163,74,.85); }
  .cbtn.b { right: 0; bottom: 62px; background: rgba(220,38,38,.85); }
  .cbtn.x { right: 124px; bottom: 62px; background: rgba(37,99,235,.85); }
  .cbtn.y { right: 62px; bottom: 124px; background: rgba(234,179,8,.9); color: #1a1a1a; }
  .cbtn.s { right: 134px; bottom: -6px; width: 56px; height: 56px; background: rgba(15,23,42,.85); font-size: 10px; }

  #menu { pointer-events: auto; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,10,20,.55); }
  #menu[hidden] { display: none; }
  .panel { width: 90%; max-width: 360px; box-sizing: border-box; background: rgba(10,20,36,.95); border: 1px solid rgba(255,255,255,.12); border-radius: 16px;
    padding: 18px 16px; color: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .panel h1 { margin: 0 0 2px; font-size: 24px; font-weight: 900; letter-spacing: .5px; }
  .panel .sub { margin: 0 0 12px; color: #9fb3c8; font-size: 13px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mi { background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); color: #fff; border-radius: 12px; padding: 10px 8px;
    text-align: left; font-size: 13px; font-weight: 800; cursor: pointer; }
  .mi small { display: block; font-weight: 500; color: #9fb3c8; font-size: 11px; margin-top: 2px; }
  .mi.sel { border-color: #ffe14d; background: rgba(255,225,77,.12); }
  .nav.focus { outline: 3px solid #60a5fa; outline-offset: 2px; }
  #help { margin: 12px 0 4px; font-size: 12px; color: #cbd5e1; line-height: 1.55; min-height: 56px; }
  #padStatus { font-size: 11px; color: #86efac; min-height: 15px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; }
  .primary { flex: 1; background: #16a34a; border: 0; color: #fff; font-weight: 900; font-size: 16px; padding: 12px; border-radius: 12px; cursor: pointer; }
  .secondary { background: rgba(255,255,255,.12); border: 0; color: #fff; font-weight: 800; font-size: 14px; padding: 12px 14px; border-radius: 12px; cursor: pointer; }
  .secondary[hidden] { display: none; }
  #toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); background: rgba(6,18,10,.88); color: #fff; padding: 6px 12px;
    border-radius: 20px; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #rotateTip { position: absolute; left: 50%; top: 128px; transform: translateX(-50%); background: rgba(6,18,10,.88); color: #ffe14d; padding: 7px 14px;
    border-radius: 20px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  #rotateTip[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view3d"></canvas>
  <canvas id="game"></canvas>
  <div id="ui">
    <button id="pauseBtn" aria-label="Pause and controls">II</button>
    <div id="touchCtl" hidden>
      <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
      <div id="btns">
        <button class="cbtn y" data-b="Y">THROUGH</button>
        <button class="cbtn x" data-b="X">LOB</button>
        <button class="cbtn b" data-b="B">SHOOT</button>
        <button class="cbtn a" data-b="A">PASS</button>
        <button class="cbtn s" data-b="SPRINT">SPRINT</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="rotateTip" hidden>&#x21bb; Turn your phone sideways for the full view</div>
    <div id="menu">
      <div class="panel">
        <h1>Flick Match</h1>
        <p class="sub">Choose how you want to play</p>
        <div class="opts">
          <button class="mi nav" data-mode="buttons">Touch buttons<small>Joystick + buttons</small></button>
          <button class="mi nav" data-mode="swipe">Swipe<small>Flick to pass &amp; shoot</small></button>
          <button class="mi nav" data-mode="keyboard">Keyboard<small>Laptop / PC</small></button>
          <button class="mi nav" data-mode="gamepad">Gamepad<small>Plug in a controller</small></button>
        </div>
        <div id="help"></div>
        <div id="padStatus"></div>
        <div class="row">
          <button id="startBtn" class="primary nav">Kick off</button>
          <button id="restartBtn" class="secondary nav" hidden>Restart</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
