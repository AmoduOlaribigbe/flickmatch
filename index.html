<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b6b2f">
<link rel="manifest" href="manifest.json">
<title>Flick Match</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d3d1a; overflow: hidden; touch-action: none; font-family: sans-serif; }
  canvas { display: block; margin: 0 auto; background: #1b6b2f; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
