<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1d33">
<link rel="manifest" href="manifest.json">
<title>Flick Match</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1424; overflow: hidden; touch-action: none; font-family: sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #view3d { background: #0f1d33; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view3d"></canvas>
  <canvas id="game"></canvas>
</div>
<script type="module" src="game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
